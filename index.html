<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind-Route 盲盒行程</title>
  <style>
    :root {
      --primary-color: #f7a072;
      --primary-hover: #f58a4b;
      --bg-color: #fff9f5;
      --card-bg: #ffffff;
      --text-color: #4a3e3d;
      --text-muted: #8c7b75;
      --accent-color: #f3c292;
      --danger-color: #e76f51;
      --border-color: #f3e5dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(230, 160, 120, 0.15);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .page {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .page.active {
      display: flex;
    }

    h1 {
      font-size: 24px;
      color: #d96b27;
      text-align: center;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 20px;
      color: #d96b27;
      margin-bottom: 16px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      width: auto;
      margin-top: 0;
      text-decoration: none;
      display: inline-block;
    }

    .btn-nav {
      background-color: #f4a261;
      color: white;
    }

    .btn-delete {
      background-color: var(--danger-color);
      color: white;
    }

    /* 主頁樣式 */
    .draw-section {
      text-align: center;
      margin: 40px 0;
    }

    .list-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--text-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 6px;
    }

    .selected-list {
      list-style: none;
      margin-bottom: 20px;
    }

    .selected-item {
      background-color: var(--bg-color);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .item-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .item-name {
      font-weight: bold;
      font-size: 15px;
    }

    .item-hours {
      font-size: 12px;
      color: var(--text-muted);
    }

    .item-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* 選擇地點頁面 */
    .category-title {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      background-color: #fff2e6;
      padding: 6px 12px;
      border-radius: 8px;
      margin: 16px 0 10px 0;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 16px;
    }

    .option-card {
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background-color: #fff;
    }

    .option-card.selected {
      border-color: var(--primary-color);
      background-color: #fff5ee;
    }

    .option-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .option-name {
      font-weight: bold;
      font-size: 15px;
    }

    .option-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .day-badge {
      font-size: 11px;
      background: #ffe3d1;
      color: #d96b27;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 主頁面 -->
    <div id="page-main" class="page active">
      <h1>Blind-Route 盲盒行程</h1>
      
      <div class="draw-section">
        <button id="btn-draw" class="btn" style="font-size: 18px; padding: 18px;">🎲 下一站去哪裡</button>
      </div>

      <div class="list-title">已選擇的候選站點</div>
      <ul id="main-selected-list" class="selected-list">
        <!-- 動態帶入已選站點 -->
      </ul>

      <div style="margin-top: auto;">
        <button id="btn-go-select" class="btn">GO!!</button>
      </div>
    </div>

    <!-- 選擇地點頁面 -->
    <div id="page-select" class="page">
      <h2>選擇 2~3 個想去的地方吧！</h2>
      
      <div id="options-container" class="options-grid">
        <!-- 動態帶入分類選項 -->
      </div>

      <div style="margin-top: auto;">
        <button id="btn-confirm-select" class="btn">START</button>
      </div>
    </div>
  </div>

  <script>
    // 景點與店家資料庫 (包含營業時間與地圖連結)
    const locationsData = [
      {
        id: "1",
        category: "景點",
        name: "故宮南院",
        mapUrl: "https://maps.app.goo.gl/oZZ8SVMHhxhwtmtK6",
        satHours: "09:00–18:00",
        sunHours: "09:00–18:00"
      },
      {
        id: "2",
        category: "咖啡廳",
        name: "明明",
        mapUrl: "https://maps.app.goo.gl/KbW8oR5vmdqJpLkH8",
        satHours: "13:00–19:00",
        sunHours: "13:00–19:00"
      },
      {
        id: "3",
        category: "咖啡廳",
        name: "曙光咖啡",
        mapUrl: "https://maps.app.goo.gl/tYhBm1HPVBAndt2S7",
        satHours: "10:00–18:00",
        sunHours: "10:00–18:00"
      },
      {
        id: "4",
        category: "美食／小吃",
        name: "崇文涼麵",
        mapUrl: "https://maps.app.goo.gl/KZcHrdTbtw6DD3v76",
        satHours: "10:30–18:30",
        sunHours: "10:30–18:30"
      },
      {
        id: "5",
        category: "美食／小吃",
        name: "吳記排骨酥",
        mapUrl: "https://maps.app.goo.gl/dAHTaJPMU2HDDmrZ6",
        satHours: "16:00–23:00",
        sunHours: "16:00–23:00"
      }
    ];

    // 當前選擇的 ID 陣列
    let selectedIds = ["1", "2", "3"];

    // 判斷今天是星期六還是星期日（預設顯示六或日）
    function getTodayDayText() {
      const day = new Date().getDay();
      return day === 0 ? "星期日" : "星期六"; // 預設非週日就顯示週六
    }

    function getHoursByDay(item) {
      const day = new Date().getDay();
      return day === 0 ? item.sunHours : item.satHours;
    }

    // 渲染主頁面選單
    function renderMainList() {
      const listEl = document.getElementById("main-selected-list");
      listEl.innerHTML = "";

      if (selectedIds.length === 0) {
        listEl.innerHTML = `<li style="text-align:center; color:var(--text-muted); padding:20px;">目前沒有選擇任何站點，請點擊 GO!! 挑選。</li>`;
        return;
      }

      const dayText = getTodayDayText();

      selectedIds.forEach(id => {
        const item = locationsData.find(loc => loc.id === id);
        if (!item) return;

        const li = document.createElement("li");
        li.className = "selected-item";
        li.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            <span class="item-hours">${dayText}營業時間：${getHoursByDay(item)}</span>
          </div>
          <div class="item-actions">
            <a href="${item.mapUrl}" target="_blank" class="btn-small btn-nav">Google maps 導航</a>
            <button class="btn-small btn-delete" onclick="deleteItem('${item.id}')">刪除</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    // 刪除單一站點
    function deleteItem(id) {
      selectedIds = selectedIds.filter(itemId => itemId !== id);
      renderMainList();
    }

    // 渲染選擇頁面 (分門別類)
    function renderSelectOptions() {
      const container = document.getElementById("options-container");
      container.innerHTML = "";

      // 依類別分組
      const categories = [...new Set(locationsData.map(item => item.category))];
      const dayText = getTodayDayText();

      categories.forEach(cat => {
        const catTitle = document.createElement("div");
        catTitle.className = "category-title";
        catTitle.textContent = cat;
        container.appendChild(catTitle);

        const items = locationsData.filter(item => item.category === cat);
        items.forEach(item => {
          const isSelected = selectedIds.includes(item.id);
          const card = document.createElement("div");
          card.className = `option-card ${isSelected ? 'selected' : ''}`;
          card.onclick = () => toggleSelect(item.id, card);

          card.innerHTML = `
            <div class="option-header">
              <span class="option-name">${item.name}</span>
              <span class="day-badge">${dayText}</span>
            </div>
            <div class="option-desc">營業時間：${getHoursByDay(item)}</div>
          `;
          container.appendChild(card);
        });
      });
    }

    // 切換選取狀態
    function toggleSelect(id, cardEl) {
      if (selectedIds.includes(id)) {
        selectedIds = selectedIds.filter(i => i !== id);
        cardEl.classList.remove("selected");
      } else {
        selectedIds.push(id);
        cardEl.classList.add("selected");
      }
    }

    // 頁面切換
    document.getElementById("btn-go-select").onclick = () => {
      renderSelectOptions();
      document.getElementById("page-main").classList.remove("active");
      document.getElementById("page-select").classList.add("active");
    };

    document.getElementById("btn-confirm-select").onclick = () => {
      renderMainList();
      document.getElementById("page-select").classList.remove("active");
      document.getElementById("page-main").classList.add("active");
    };

    // 隨機抽籤功能
    document.getElementById("btn-draw").onclick = () => {
      if (selectedIds.length === 0) {
        alert("請先點擊 GO!! 選擇至少一個站點喔！");
        return;
      }
      const randomIndex = Math.floor(Math.random() * selectedIds.length);
      const selectedId = selectedIds[randomIndex];
      const selectedLocation = locationsData.find(loc => loc.id === selectedId);

      alert(`🎲 下一站抽中了：【${selectedLocation.name}】！`);
    };

    // 初始化
    renderMainList();
  </script>
</body>
</html>
