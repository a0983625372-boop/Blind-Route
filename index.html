<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>chiaYIII · 7/25–7/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall: #F9F6EF;
    --sofa: #85C3E8;
    --apple: #8C0503;
    --lamp: #081530;
    --wine: #4A2D18;

    --bg: var(--wall);
    --card: #FFFFFF;
    --ink: var(--lamp);
    --ink-soft: #7C8797;
    --accent: var(--lamp);
    --pop: var(--apple);
    --secondary: var(--sofa);
    --secondary-soft: #EAF4FC;
    --warm: var(--wine);
    --warm-soft: #F1E6DD;
    --line: #EDE6D8;
    --shadow: 0 4px 14px rgba(8, 21, 48, 0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    -webkit-tap-highlight-color: transparent;
    min-height:100vh;
    padding-bottom: 48px;
  }

  header{
    padding: 28px 20px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  header h1{
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  header p{
    margin:0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .day-tabs{
    display:flex;
    gap: 8px;
    margin-top: 16px;
  }
  .day-tab{
    flex:1;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 0;
    border-radius: 12px;
    cursor:pointer;
    transition: transform .15s ease;
  }
  .day-tab.active{
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: scale(1.02);
  }

  main{ padding: 20px 16px 8px; max-width: 480px; margin: 0 auto; }

  .timeline{ position:relative; padding-left: 24px; }
  .timeline::before{
    content:'';
    position:absolute;
    left: 4px; top: 8px; bottom: 8px;
    width: 2px;
    background: var(--secondary);
    opacity: 0.5;
  }

  .tl-item{ position:relative; margin-bottom: 18px; }
  .tl-dot{
    position:absolute;
    left: -22px; top: 16px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--secondary);
    border: 2px solid var(--bg);
  }
  .tl-dot.route{ background: var(--pop); }

  .stop-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px 16px;
    box-shadow: var(--shadow);
    transition: transform .15s ease;
  }
  .stop-card:hover{ transform: translateY(-1px); }
  .stop-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 6px;
  }
  .stop-tag{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .stop-tag.route{ color: #fff; background: var(--pop); }
  .stop-tag.cat{ color: var(--ink); background: var(--secondary-soft); border: 1px solid var(--secondary-soft); }
  .stop-time{
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
  }
  .stop-delete{
    font-size: 12px;
    color: var(--ink-soft);
    cursor:pointer;
    background:none;
    border:none;
    padding: 4px;
  }
  .stop-name{
    font-family:'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 17px;
    margin: 4px 0 2px;
    color: var(--ink);
  }
  .stop-note{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .stop-map-btn{
    display:inline-block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    background: var(--secondary);
    text-decoration:none;
    padding: 7px 14px;
    border-radius: 999px;
    transition: transform .12s ease;
  }
  .stop-map-btn:active{ transform: scale(0.95); }

  .next-stop-btn{
    width:100%;
    padding: 16px;
    border-radius: 18px;
    border: 2px dashed var(--secondary);
    background: var(--card);
    color: var(--accent);
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 16px;
    cursor:pointer;
    margin-bottom: 6px;
    transition: transform .15s ease;
  }
  .next-stop-btn:active{ transform: scale(0.97); }
  .next-stop-btn:hover .dice{ display:inline-block; animation: wobble .5s ease; }
  @keyframes wobble{
    0%,100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-12deg); }
    75%{ transform: rotate(12deg); }
  }

  .empty-hint{
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 8px 0 16px;
  }

  /* Modal */
  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(58, 36, 24, 0.35);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index: 50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 22px 22px 0 0;
    padding: 20px 18px 28px;
  }
  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 4px;
  }
  .modal-title{
    font-family:'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 19px;
  }
  .modal-close{
    background:none;
    border:none;
    font-size: 22px;
    color: var(--ink-soft);
    cursor:pointer;
    line-height:1;
    padding: 4px;
  }
  .modal-sub{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }

  .category-block{ margin-bottom: 18px; }
  .category-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .category-label::before{
    content:'';
    width: 6px; height: 6px;
    background: currentColor;
    border-radius: 50%;
    display:inline-block;
  }

  .option-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 8px;
    cursor:pointer;
  }
  .option-item.selected{
    border-color: var(--warm);
    background: var(--warm-soft);
  }
  .option-item.disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }
  .option-main{ flex:1; }
  .option-name{ font-weight: 700; font-size: 15px; }
  .option-hours{ font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .option-check{
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--secondary);
    flex-shrink:0;
    margin-left: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .option-item.selected .option-check{
    background: var(--warm);
    border-color: var(--warm);
  }
  .option-item.selected .option-check::after{
    content:'';
    width: 8px; height:8px;
    border-radius:50%;
    background:#fff;
  }

  .selection-status{
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding-top: 10px;
    padding-bottom: 4px;
  }
  .status-text{
    text-align:center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .status-text b{ color: var(--accent); }

  .primary-btn{
    width:100%;
    padding: 14px;
    border-radius: 14px;
    border:none;
    background: var(--pop);
    color:#fff;
    font-weight: 700;
    font-size: 15px;
    font-family:'Noto Serif TC', serif;
    cursor:pointer;
  }
  .primary-btn:disabled{
    background: var(--secondary);
    color: #fff;
    cursor:not-allowed;
  }

  /* Draw screen */
  .draw-wrap{
    text-align:center;
    padding: 10px 0 6px;
  }
  .sticks-row{
    display:flex;
    justify-content:center;
    gap: 14px;
    margin: 10px 0 20px;
    min-height: 150px;
    align-items:flex-end;
  }
  .stick{
    width: 56px;
    height: 150px;
    border-radius: 10px 10px 4px 4px;
    background: var(--secondary);
    border: 1.5px solid var(--secondary);
    position: relative;
    cursor: pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stick.shuffling{
    animation: shuffle-move 0.9s ease-in-out infinite;
  }
  @keyframes shuffle-move{
    0%{ transform: translateY(0) rotate(0deg); }
    25%{ transform: translateY(-10px) rotate(-3deg); }
    50%{ transform: translateY(0) rotate(2deg); }
    75%{ transform: translateY(-6px) rotate(-2deg); }
    100%{ transform: translateY(0) rotate(0deg); }
  }
  .stick .stick-label{
    writing-mode: vertical-rl;
    color: var(--ink);
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size: 15px;
    letter-spacing: 3px;
  }
  .stick.revealed{
    background: var(--pop);
    border-color: var(--pop);
    animation: pop-in .3s ease;
  }
  @keyframes pop-in{
    0%{ transform: scale(0.85); }
    60%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  .stick.revealed .stick-mark{
    color: #fff;
    font-size: 26px;
    font-weight: 900;
  }
  .stick.dimmed{
    opacity: 0.3;
    cursor: default;
  }

  .result-box{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 18px 16px;
    margin-bottom: 14px;
    text-align:center;
    display:none;
  }
  .result-box.show{ display:block; }
  .result-label{
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .result-name{
    font-family:'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .result-hours{
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 700;
  }

  .footer-note{
    text-align:center;
    color: var(--ink-soft);
    font-size: 11.5px;
    margin-top: 24px;
    padding: 0 24px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <h1>嘉義小旅行</h1>
  <p>7/25（六）－ 7/26（日） · 行程手冊</p>
  <div class="day-tabs">
    <button class="day-tab active" data-day="day1">7/25　週六</button>
    <button class="day-tab" data-day="day2">7/26　週日</button>
  </div>
</header>

<main>
  <div class="timeline" id="timeline"></div>
</main>

<div class="footer-note">
  營業時間以 Google Maps 店家頁面公告為準，出發前建議再次確認。
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ---------------- Data ---------------- */

const optionsLibrary = [
  {
    key: 'meal', label: '正餐',
    items: [
      { id:'lin', name:'林聰明沙鍋魚頭', mapQuery:'林聰明沙鍋魚頭 嘉義市中正路361號', hours:{ sat:'12:00–22:00', sun:'12:00–22:00' } },
      { id:'chongwen', name:'崇文嘉義涼麵', mapUrl:'https://maps.app.goo.gl/KZcHrdTbtw6DD3v76', hours:{ sat:'11:00–20:00', sun:'11:00–20:00' } },
    ]
  },
  {
    key: 'cafe', label: '咖啡廳',
    items: [
      { id:'mingming', name:'明明MingMing', mapUrl:'https://maps.app.goo.gl/KbW8oR5vmdqJpLkH8', hours:{ sat:'依店家 IG／FB 公告', sun:'依店家 IG／FB 公告' } },
      { id:'shuguang', name:'曙光珈琲', mapUrl:'https://maps.app.goo.gl/tYhBm1HPVBAndt2S7', hours:{ sat:'詳見 Google Maps 店家頁面', sun:'詳見 Google Maps 店家頁面' } },
      { id:'xinhuamei', name:'新華美西裝社', mapQuery:'新華美西裝社 嘉義市成仁街80號', hours:{ sat:'11:00–17:30', sun:'11:00–17:30' } },
    ]
  },
  {
    key: 'snack', label: '點心',
    items: [
      { id:'renzhichu', name:'仁芝初', mapQuery:'仁芝初 嘉義', hours:{ sat:'詳見 Google Maps 店家頁面', sun:'詳見 Google Maps 店家頁面' } },
      { id:'wuji', name:'吳記排骨酥', mapUrl:'https://maps.app.goo.gl/dAHTaJPMU2HDDmrZ6', hours:{ sat:'16:00－翌日 00:00', sun:'16:00－翌日 00:00' } },
    ]
  },
  {
    key: 'drink', label: '飲料',
    items: [
      { id:'rongxing', name:'榮興茶行', mapQuery:'榮興茶行 嘉義市民族路601號', hours:{ sat:'10:00–21:00', sun:'10:00–21:00' } },
      { id:'yunqihao', name:'韻沏好', mapQuery:'韻沏好 嘉義市民權路422號', hours:{ sat:'10:00–21:00', sun:'10:00–21:00' } },
      { id:'guyi', name:'穀壹', mapQuery:'穀壹綠豆沙專門店 嘉義', hours:{ sat:'詳見 Google Maps 店家頁面', sun:'詳見 Google Maps 店家頁面' } },
      { id:'xinzhuang', name:'新庄紅茶', mapQuery:'新庄紅茶 嘉義市新庄街98號', hours:{ sat:'08:00–22:00', sun:'08:00–22:00' } },
    ]
  },
  {
    key: 'shop', label: '逛街',
    items: [
      { id:'hunter', name:'小獵犬商號', mapQuery:'Hunter Goods 小獵犬商號 嘉義', hours:{ sat:'詳見 Google Maps 店家頁面', sun:'詳見 Google Maps 店家頁面' } },
      { id:'jxacces', name:'JxAcces', mapQuery:'JxAcces 嘉義市中山路130號', hours:{ sat:'14:30–21:00', sun:'14:30–21:00' } },
    ]
  },
  {
    key: 'attraction', label: '景點',
    items: [
      { id:'wanglaishan', name:'旺萊山', mapQuery:'旺萊山鳳梨文化園區 嘉義', hours:{ sat:'09:00–18:00', sun:'09:00–18:00' } },
      { id:'meme', name:'咩咩上樹萌寵樂園', mapQuery:'咩咩上樹萌寵樂園 嘉義', hours:{ sat:'09:00–17:00', sun:'09:00–17:00' } },
      { id:'npm', name:'故宮南院', mapUrl:'https://maps.app.goo.gl/oZZ8SVMHhxhwtmtK6', hours:{ sat:'09:00–18:00', sun:'09:00–18:00' } },
    ]
  },
  {
    key: 'souvenir', label: '伴手禮',
    items: [
      { id:'apan', name:'阿潘肉包', mapQuery:'阿潘肉包 伴手禮 中正店 嘉義市中正路345號', hours:{ sat:'11:00–20:30', sun:'11:00–20:30' } },
    ]
  },
];

function findOptionById(id){
  for(const cat of optionsLibrary){
    const found = cat.items.find(i=>i.id===id);
    if(found) return found;
  }
  return null;
}

function categoryLabelForId(id){
  for(const cat of optionsLibrary){
    if(cat.items.find(i=>i.id===id)) return cat.label;
  }
  return '';
}

function mapLinkFor(item){
  if(item.mapUrl) return item.mapUrl;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.mapQuery || item.name);
}

/* ---------------- State ---------------- */

const STORAGE_KEY = 'chiayiTripState_v3';
let currentDay = 'day1';
let idCounter = 1;

const days = {
  day1: {
    label: '7/25', weekday:'週六', hoursKey:'sat',
    fixedStart: { name:'渝川', time:'13:30', note:'吃午餐、粗花' },
    fixedEnd: null,
    stops: []
  },
  day2: {
    label: '7/26', weekday:'週日', hoursKey:'sun',
    fixedStart: { name:'海森', time:'11:00', note:'吃午餐、粗花' },
    fixedEnd: { name:'東石海之夏', note:'東石漁人碼頭．海上煙火約 19:30 施放' },
    stops: []
  }
};

function saveState(){
  const state = {
    idCounter,
    days: {
      day1: { fixedStartDeleted: !days.day1.fixedStart, fixedEndDeleted: !days.day1.fixedEnd, stops: days.day1.stops },
      day2: { fixedStartDeleted: !days.day2.fixedStart, fixedEndDeleted: !days.day2.fixedEnd, stops: days.day2.stops }
    }
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('save failed', e); }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const state = JSON.parse(raw);
    if(typeof state.idCounter === 'number') idCounter = state.idCounter;
    if(state.days){
      ['day1','day2'].forEach(key=>{
        if(state.days[key]){
          if(state.days[key].fixedStartDeleted) days[key].fixedStart = null;
          if(state.days[key].fixedEndDeleted) days[key].fixedEnd = null;
          days[key].stops = state.days[key].stops || [];
        }
      });
    }
  }catch(e){ console.error('load failed', e); }
}

/* ---------------- Render itinerary ---------------- */

function renderTimeline(){
  const day = days[currentDay];
  const el = document.getElementById('timeline');
  let html = '';

  if(day.fixedStart){
    html += tlItemHtml({
      tagText: '起點', tagClass: 'route',
      time: day.fixedStart.time,
      name: day.fixedStart.name,
      note: day.fixedStart.note || '',
      mapLink: mapLinkFor({ mapQuery: day.fixedStart.name }),
      deleteTarget: { type:'fixedStart', day: currentDay }
    });
  }

  day.stops.forEach(stop=>{
    html += tlItemHtml({
      tagText: stop.category || '', tagClass: 'cat',
      time: '',
      name: stop.name,
      note: stop.hours || '',
      mapLink: mapLinkFor(stop),
      deleteTarget: { type:'stop', day: currentDay, id: stop.uid }
    });
  });

  html += `<button class="next-stop-btn" onclick="openLibrary()"><span class="dice">🎲</span>　下一站去哪裡</button>`;

  if(day.fixedEnd){
    html += tlItemHtml({
      tagText: '終點', tagClass: 'route',
      time: day.fixedEnd.time || '',
      name: day.fixedEnd.name,
      note: day.fixedEnd.note || '',
      mapLink: mapLinkFor({ mapQuery: day.fixedEnd.name }),
      deleteTarget: { type:'fixedEnd', day: currentDay }
    });
  }

  if(!day.fixedStart && day.stops.length===0 && !day.fixedEnd){
    html += `<div class="empty-hint">目前沒有站點，點選上方按鈕開始抽籤吧</div>`;
  }

  el.innerHTML = html;
}

function tlItemHtml({ tagText, tagClass, time, name, note, mapLink, deleteTarget }){
  const tagHtml = tagText ? `<span class="stop-tag ${tagClass}">${tagText}</span>` : `<span></span>`;
  const timeHtml = time ? `<span class="stop-time">${time}</span>` : '';
  return `
    <div class="tl-item">
      <div class="tl-dot ${tagClass === 'route' ? 'route' : ''}"></div>
      <div class="stop-card">
        <div class="stop-top">
          <div style="display:flex;align-items:center;gap:8px;">
            ${tagHtml}
            ${timeHtml}
          </div>
          <button class="stop-delete" onclick='deleteStop(${JSON.stringify(deleteTarget)})'>刪除</button>
        </div>
        <div class="stop-name">${name}</div>
        ${note ? `<div class="stop-note">${note}</div>` : ''}
        <a class="stop-map-btn" href="${mapLink}" target="_blank" rel="noopener">GOOGLE MAPS 導航</a>
      </div>
    </div>
  `;
}

function deleteStop(target){
  const day = days[target.day];
  if(target.type === 'fixedStart'){ day.fixedStart = null; }
  else if(target.type === 'fixedEnd'){ day.fixedEnd = null; }
  else if(target.type === 'stop'){ day.stops = day.stops.filter(s=>s.uid !== target.id); }
  saveState();
  renderTimeline();
}

/* ---------------- Day tabs ---------------- */

document.querySelectorAll('.day-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.day-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentDay = btn.dataset.day;
    renderTimeline();
  });
});

/* ---------------- Library / Draw Modal ---------------- */

let selectedIds = [];
let shuffledOptionIds = [];
let revealedId = null;

function openLibrary(){
  selectedIds = [];
  renderSelectStep();
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

function renderSelectStep(){
  const hoursKey = days[currentDay].hoursKey;

  let catsHtml = '';
  optionsLibrary.forEach(cat=>{
    let itemsHtml = '';
    cat.items.forEach(item=>{
      const isSelected = selectedIds.includes(item.id);
      const isDisabled = !isSelected && selectedIds.length >= 3;
      itemsHtml += `
        <div class="option-item ${isSelected?'selected':''} ${isDisabled?'disabled':''}"
             onclick="${isDisabled ? '' : `toggleOption('${item.id}')`}">
          <div class="option-main">
            <div class="option-name">${item.name}</div>
            <div class="option-hours">${item.hours[hoursKey]}</div>
          </div>
          <div class="option-check"></div>
        </div>
      `;
    });
    catsHtml += `
      <div class="category-block">
        <div class="category-label">${cat.label}</div>
        ${itemsHtml}
      </div>
    `;
  });

  const count = selectedIds.length;
  const canDraw = count === 2 || count === 3;

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-header">
      <div class="modal-title">選項清單</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    ${catsHtml}
    <div class="selection-status">
      <div class="status-text">已選 <b>${count}</b> / 最多 3 個</div>
      <button class="primary-btn" ${canDraw?'':'disabled'} onclick="startShuffle()">開始抽籤</button>
    </div>
  `;
}

function toggleOption(id){
  if(selectedIds.includes(id)){
    selectedIds = selectedIds.filter(i=>i!==id);
  }else{
    if(selectedIds.length >= 3) return;
    selectedIds.push(id);
  }
  renderSelectStep();
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startShuffle(){
  shuffledOptionIds = shuffleArray(selectedIds);
  revealedId = null;
  renderDrawStep(true);
  setTimeout(()=>{
    document.querySelectorAll('.stick').forEach(s=>s.classList.remove('shuffling'));
  }, 1100);
}

function renderDrawStep(justShuffled){
  const hoursKey = days[currentDay].hoursKey;

  let sticksHtml = '';
  shuffledOptionIds.forEach((id, idx)=>{
    const isRevealed = revealedId === id;
    const isDimmed = revealedId !== null && !isRevealed;
    const inner = isRevealed
      ? `<div class="stick-mark">✓</div>`
      : `<div class="stick-label">籤</div>`;
    sticksHtml += `
      <div class="stick ${justShuffled && revealedId===null ? 'shuffling':''} ${isRevealed?'revealed':''} ${isDimmed?'dimmed':''}"
           style="animation-delay:${idx*0.08}s"
           onclick="${revealedId===null ? `revealStick('${id}')` : ''}">
        ${inner}
      </div>
    `;
  });

  let resultHtml = `<div class="result-box"></div>`;
  let actionHtml = '';
  if(revealedId){
    const item = findOptionById(revealedId);
    resultHtml = `
      <div class="result-box show">
        <div class="result-label">抽到的站點是</div>
        <div class="result-name">${item.name}</div>
        <div class="result-hours">${item.hours[hoursKey]}</div>
      </div>
    `;
    actionHtml = `<button class="primary-btn" onclick="addRevealedToItinerary()">加入行程</button>`;
  }

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-header">
      <div class="modal-title">抽籤</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="draw-wrap">
      <div class="sticks-row">${sticksHtml}</div>
      ${resultHtml}
      ${actionHtml}
    </div>
  `;
}

function revealStick(id){
  if(revealedId !== null) return;
  revealedId = id;
  renderDrawStep(false);
}

function addRevealedToItinerary(){
  const item = findOptionById(revealedId);
  const hoursKey = days[currentDay].hoursKey;
  const day = days[currentDay];
  day.stops.push({
    uid: idCounter++,
    name: item.name,
    mapUrl: item.mapUrl,
    mapQuery: item.mapQuery,
    category: categoryLabelForId(item.id),
    hours: item.hours[hoursKey]
  });
  saveState();
  closeModal();
  renderTimeline();
}

/* ---------------- Init ---------------- */
loadState();
renderTimeline();
</script>
