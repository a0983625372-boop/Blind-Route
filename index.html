<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘉義盲盒行程抽籤器</title>
  <style>
    :root {
      --primary: #f7a072;
      --primary-hover: #f58a4b;
      --bg: #fff9f5;
      --card-bg: #ffffff;
      --text: #4a3e3d;
      --text-muted: #8c7b75;
      --border: #f3e5dc;
      --accent: #fff2e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(230, 160, 120, 0.15);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 22px;
      color: #d96b27;
      text-align: center;
      margin-bottom: 16px;
    }

    /* 日期頁籤 */
    .date-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #f5e9e2;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    /* 行程時間軸 */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .node {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .node-title {
      font-size: 15px;
      font-weight: bold;
    }

    .node-tag {
      font-size: 11px;
      background: #fce1d1;
      color: #d96b27;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
    }

    .btn-map {
      background-color: #f4a261;
      color: white;
      text-decoration: none;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .btn-draw {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .btn-draw:hover {
      background-color: var(--primary-hover);
    }

    /* Modal 彈出視窗（挑選庫） */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      font-size: 18px;
      font-weight: bold;
      color: #d96b27;
      text-align: center;
      margin-bottom: 12px;
    }

    .options-scroll {
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cat-title {
      font-size: 14px;
      font-weight: bold;
      background: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      color: #333;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .option-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      background: #fff;
    }

    .option-card.selected {
      border-color: var(--primary);
      background-color: #fff5ee;
      font-weight: bold;
      color: #d96b27;
    }

    .modal-footer {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .btn-cancel {
      background: #e0e0e0;
      border: none;
      padding: 12px;
      border-radius: 10px;
      flex: 1;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      flex: 2;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>盲盒行程抽籤器</h1>

    <!-- 頁籤 -->
    <div class="date-tabs">
      <button class="tab-btn active" id="tab-725" onclick="switchTab('725')">7/25 (六)</button>
      <button class="tab-btn" id="tab-726" onclick="switchTab('726')">7/26 (日)</button>
    </div>

    <!-- 行程列表 -->
    <div id="timeline-container" class="timeline"></div>

    <!-- 抽籤按鈕 -->
    <button class="btn-draw" onclick="openSelectModal()">🎲 下一站去哪裡</button>
  </div>

  <!-- 選項庫 Modal -->
  <div id="select-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">選擇 2~3 個想去的地方吧！</div>
      <div id="options-scroll" class="options-scroll"></div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeSelectModal()">取消</button>
        <button class="btn-start" onclick="drawFromSelection()">START 開始抽籤</button>
      </div>
    </div>
  </div>

  <script>
    // 店家與地點資料庫 (分類明確)
    const placeDB = {
      "正餐": [
        { name: "林聰明沙鍋魚頭", map: "https://maps.app.goo.gl/" },
        { name: "崇文涼麵", map: "https://maps.app.goo.gl/KZcHrdTbtw6DD3v76" }
      ],
      "咖啡廳": [
        { name: "明明", map: "https://maps.app.goo.gl/KbW8oR5vmdqJpLkH8" },
        { name: "曙光咖啡", map: "https://maps.app.goo.gl/tYhBm1HPVBAndt2S7" },
        { name: "新華美西裝社", map: "https://maps.app.goo.gl/" }
      ],
      "點心": [
        { name: "仁芝初", map: "https://maps.app.goo.gl/" },
        { name: "吳記排骨酥", map: "https://maps.app.goo.gl/dAHTaJPMU2HDDmrZ6" }
      ],
      "飲料": [
        { name: "榮興", map: "https://maps.app.goo.gl/" },
        { name: "韻沏好", map: "https://maps.app.goo.gl/" },
        { name: "穀壹", map: "https://maps.app.goo.gl/" },
        { name: "新庄紅茶", map: "https://maps.app.goo.gl/" }
      ],
      "逛街": [
        { name: "小獵犬", map: "https://maps.app.goo.gl/" },
        { name: "JxAcces", map: "https://maps.app.goo.gl/" }
      ]
    };

    // 行程狀態紀錄
    let currentDay = "725";
    let routes = {
      "725": [
        { tag: "起點", name: "13:30 渝川", map: "https://maps.app.goo.gl/" }
      ],
      "726": [
        { tag: "起點", name: "11:00 海森", map: "https://maps.app.goo.gl/" }
      ]
    };

    let tempSelected = []; // 暫存使用者勾選的地點

    // 渲染當天行程
    function renderTimeline() {
      const container = document.getElementById("timeline-container");
      container.innerHTML = "";

      let list = [...routes[currentDay]];
      
      // 7/26 結尾固定有「東石海之夏」
      if (currentDay === "726") {
        list.push({ tag: "終點", name: "東石海之夏", map: "https://maps.app.goo.gl/" });
      }

      list.forEach((item, index) => {
        const node = document.createElement("div");
        node.className = "node";
        node.innerHTML = `
          <div>
            <span class="node-tag">${item.tag || '站點 ' + index}</span>
            <span class="node-title">${item.name}</span>
          </div>
          <a href="${item.map}" target="_blank" class="btn-map">Google maps 導航</a>
        `;
        container.appendChild(node);
      });
    }

    // 切換日期
    function switchTab(day) {
      currentDay = day;
      document.getElementById("tab-725").classList.toggle("active", day === '725');
      document.getElementById("tab-726").classList.toggle("active", day === '726');
      renderTimeline();
    }

    // 打開選擇 Modal 並渲染分類庫
    function openSelectModal() {
      tempSelected = [];
      const scrollArea = document.getElementById("options-scroll");
      scrollArea.innerHTML = "";

      for (const [cat, places] of Object.entries(placeDB)) {
        const catBlock = document.createElement("div");
        catBlock.innerHTML = `<div class="cat-title">${cat}</div>`;
        
        const grid = document.createElement("div");
        grid.className = "option-grid";

        places.forEach(p => {
          const card = document.createElement("div");
          card.className = "option-card";
          card.innerText = p.name;
          card.onclick = () => {
            if (tempSelected.includes(p)) {
              tempSelected = tempSelected.filter(item => item !== p);
              card.classList.remove("selected");
            } else {
              tempSelected.push(p);
              card.classList.add("selected");
            }
          };
          grid.appendChild(card);
        });

        catBlock.appendChild(grid);
        scrollArea.appendChild(catBlock);
      }

      document.getElementById("select-modal").classList.add("active");
    }

    function closeSelectModal() {
      document.getElementById("select-modal").classList.remove("active");
    }

    // 從勾選項目中隨機抽籤
    function drawFromSelection() {
      if (tempSelected.length < 2 || tempSelected.length > 3) {
        alert("請選擇 2~3 個想去的地方再進行抽籤喔！");
        return;
      }

      const winner = tempSelected[Math.floor(Math.random() * tempSelected.length)];
      alert(`🎲 恭喜抽中：【${winner.name}】！已為你加入行程！`);

      // 加入行程
      routes[currentDay].push({
        tag: "途經",
        name: winner.name,
        map: winner.map
      });

      closeSelectModal();
      renderTimeline();
    }

    // 預設初始化
    renderTimeline();
  </script>
</body>
</html>
